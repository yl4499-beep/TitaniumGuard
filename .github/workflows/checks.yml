name: Check TitaniumGuard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: app/.python-version
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install pinned test requirements
        run: python -m pip install -r app/requirements-dev.txt
      - name: Check statistical and API behavior
        run: python -m pytest tests app/test_api.py -q
      - name: Check deployment files and dataset mirrors
        run: python tests/check_release.py
